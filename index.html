<!DOCTYPE html>
<html>
<head>
  <title>Daily Faith</title>
</head>
<body>

<h1>Daily Faith</h1>

<h2>📖 Verse</h2>
<p id="verse"></p>

<h2>✍️ Devotional</h2>
<p id="devotional"></p>

<h2>🙏 Prayer</h2>
<p id="prayer"></p>

<script>
fetch("./today.json")
  .then(res => res.json())
  .then(data => {
    document.getElementById("verse").innerText = data.verse;
    document.getElementById("devotional").innerText = data.devotional;
    document.getElementById("prayer").innerText = data.prayer;
  });
</script>

</body>
</html>
